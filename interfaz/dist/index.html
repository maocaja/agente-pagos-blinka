<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decisiones</title>
  <link rel="stylesheet" href="app.css">
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script defer src="alpine.min.js"></script>
</head>
<body x-data="app()" x-init="init()" class="min-h-screen">
  <header class="flex flex-wrap items-center gap-4 border-b border-linea px-6 py-3">
    <h1 class="text-xl font-semibold">Decisiones</h1>
    <span class="etiqueta-simulada">rol simulado</span>
    <div class="segmento" role="radiogroup" aria-label="Rol">
      <template x-for="r in ['analista','cfo']" :key="r">
        <button type="button" role="radio" :aria-checked="rol === r" @click="cambiarRol(r)" :data-testid="'rol-' + r" x-text="r === 'cfo' ? 'CFO' : 'Analista'"></button>
      </template>
    </div>
    <span class="text-texto-2 text-sm">Mandato <span x-text="sesion ? sesion.mandato_version : '-'" data-testid="mandato-version"></span></span>
    <button type="button" class="btn btn-sec ml-auto" data-testid="cambiar-tema" @click="cambiarTema(tema === 'claro' ? 'oscuro' : 'claro')" x-text="tema === 'claro' ? 'Tema oscuro' : 'Tema claro'"></button>
  </header>

  <p x-show="error" x-cloak class="m-6 panel panel-fuerte p-4 text-frenar" role="alert" data-testid="error" x-text="error"></p>

  <main class="grid gap-6 p-6 lg:grid-cols-[minmax(0,26rem)_minmax(0,1fr)]">
    <section aria-label="Lista de decisiones">
      <div class="segmento mb-4 flex-wrap" role="radiogroup" aria-label="Filtrar por veredicto">
        <template x-for="f in filtros" :key="f">
          <button type="button" role="radio" :aria-checked="filtro === f" @click="filtro = f" :data-testid="'filtro-' + f.toLowerCase()" x-text="f === 'TODAS' ? 'Todas' : veredictos[f].texto"></button>
        </template>
      </div>
      <p x-show="cargando" class="text-texto-2">Cargando...</p>
      <p x-show="!cargando && visibles.length === 0" x-cloak class="text-texto-2" data-testid="lista-vacia">No hay decisiones con este veredicto.</p>
      <ul class="grid gap-3" data-testid="lista-decisiones">
        <template x-for="d in visibles" :key="d.id">
          <li>
            <button type="button" class="panel w-full p-4 text-left hover:bg-elevado" :class="sel && sel.id === d.id ? 'panel-fuerte' : ''" :aria-current="sel && sel.id === d.id" @click="abrir(d)" :data-testid="'decision-' + d.id">
              <span class="chip" :class="veredictos[d.veredicto].clase"><span aria-hidden="true" x-text="veredictos[d.veredicto].icono"></span><span x-text="veredictos[d.veredicto].texto"></span></span>
              <span class="mt-2 block text-sm text-texto-2" x-text="d.factura_id"></span>
              <span class="block" x-text="d.motivo_corto"></span>
            </button>
          </li>
        </template>
      </ul>
    </section>

    <section aria-label="Detalle" x-show="sel" x-cloak class="grid content-start gap-6">
      <template x-if="sel">
        <div class="panel p-5" data-testid="detalle">
          <div class="flex items-center gap-3">
            <span class="chip" :class="veredictos[sel.veredicto].clase"><span aria-hidden="true" x-text="veredictos[sel.veredicto].icono"></span><span x-text="veredictos[sel.veredicto].texto"></span></span>
            <span class="text-texto-2" x-text="sel.modo_autonomia === 'autonomo' ? 'Autonomo bajo reglas' : 'Sombra'"></span>
          </div>
          <p class="mt-2 text-lg" x-text="sel.motivo_corto"></p>
          <ul class="mt-4 grid gap-1 text-sm">
            <template x-for="r in sel.reglas" :key="r.id">
              <li class="flex gap-3"><span class="w-10 font-semibold" x-text="r.id"></span><span class="w-20" :class="r.estado === 'falla' ? 'text-frenar' : 'text-texto-2'" x-text="r.estado"></span><span class="text-texto-2" x-text="r.evidencia"></span></li>
            </template>
          </ul>
        </div>
      </template>

      <template x-if="sel && !recibo">
        <p class="panel p-4 text-texto-2" data-testid="sin-recibo">Esta decision no tiene recibo: no se emitio orden de pago.</p>
      </template>

      <template x-if="recibo">
        <article class="recibo p-6" data-testid="recibo">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h2 class="text-xl font-semibold">Recibo de decision</h2>
            <span class="etiqueta-simulada">firma de demo</span>
            <button type="button" class="btn btn-recibo-sec" data-testid="alternar-tecnica" @click="tecnica = !tecnica" x-text="tecnica ? 'Ver documento' : 'Ver vista tecnica'"></button>
          </div>

          <div x-show="!tecnica" class="mt-4 grid gap-3" data-testid="recibo-documento">
            <dl class="grid grid-cols-[10rem_1fr] gap-y-2">
              <dt class="apoyo">Factura</dt><dd x-text="(factura?.emisor?.nombre || '') + ' - ' + (factura?.referencias?.numero || recibo.factura_id)"></dd>
              <dt class="apoyo">Monto</dt>
              <dd class="cifra"><span x-text="recibo.moneda"></span> <span x-text="entero(recibo.monto_menor, recibo.moneda)"></span><span class="cent" x-text="centavos(recibo.monto_menor, recibo.moneda)"></span></dd>
              <dt class="apoyo">Decision</dt><dd x-text="veredictos[recibo.veredicto].texto + ' (' + recibo.modo_autonomia + ')'"></dd>
              <dt class="apoyo">Mandato</dt><dd x-text="recibo.mandato_version"></dd>
              <dt class="apoyo">Emitido</dt><dd x-text="recibo.emitido_en"></dd>
              <dt class="apoyo">Vence</dt><dd x-text="recibo.vence_en"></dd>
              <dt class="apoyo">Firma</dt><dd class="font-tec break-all text-sm" x-text="recibo.firma + ' (clave ' + recibo.clave_version + ')'"></dd>
            </dl>
            <ul class="linea border-t pt-3 text-sm">
              <template x-for="r in recibo.reglas" :key="r.id">
                <li class="flex gap-3"><span class="w-10 font-semibold" x-text="r.id"></span><span x-text="r.estado"></span></li>
              </template>
            </ul>
          </div>

          <div x-show="tecnica" x-cloak class="mt-4 grid gap-3" data-testid="recibo-tecnica">
            <label for="copia" class="apoyo text-sm">Alterar para la demo: se modifica una copia, nunca el recibo firmado.</label>
            <textarea id="copia" rows="14" class="input font-tec text-sm" x-model="copia" data-testid="copia-recibo"></textarea>
            <p x-show="copiaError" x-cloak class="text-frenar" role="alert" x-text="copiaError"></p>
            <div class="flex flex-wrap gap-3">
              <button type="button" class="btn btn-recibo" data-testid="verificar-copia" @click="verificarCopia()">Verificar con el guardian</button>
              <button type="button" class="btn btn-recibo-sec" data-testid="restaurar-copia" @click="restaurar()">Restaurar</button>
            </div>
          </div>

          <div class="linea mt-4 flex flex-wrap items-center gap-3 border-t pt-4">
            <button type="button" class="btn btn-recibo" data-testid="verificar-recibo" @click="verificar()">Verificar firma</button>
            <span x-show="verifRecibo" x-cloak data-testid="resultado-firma" x-text="verifRecibo && verifRecibo.valida ? 'Firma valida (clave ' + verifRecibo.clave_version + ')' : 'Firma no valida'"></span>
          </div>

          <div x-show="resultado" x-cloak class="linea mt-4 border-t pt-4" data-testid="guardian">
            <div class="flex items-center gap-4">
              <template x-if="resultado && resultado.autorizada">
                <span class="inline-block rotate-[-6deg] animate-sellar border-2 border-papel-sello px-4 py-1 text-xl font-bold uppercase text-papel-sello" data-testid="sello-ok">Autorizada</span>
              </template>
              <template x-if="resultado && !resultado.autorizada">
                <span class="sello-roto" data-testid="sello-roto" role="img" aria-label="Sello partido: orden rechazada">
                  <span class="inline-block border-2 border-frenar px-4 py-1 text-xl font-bold uppercase text-frenar">Rechaza</span><span class="inline-block border-2 border-frenar px-4 py-1 text-xl font-bold uppercase text-frenar">da</span>
                </span>
              </template>
              <p x-text="resultado && resultado.motivo"></p>
            </div>
            <ol class="mt-3 grid gap-1 text-sm">
              <template x-for="v in (resultado ? resultado.verificaciones : [])" :key="v.n">
                  <li class="flex gap-3" :data-testid="'verificacion-' + v.n">
                    <span class="w-28 font-semibold" :class="estadoVerif[v.estado].clase"><span aria-hidden="true" x-text="estadoVerif[v.estado].icono"></span> <span x-text="estadoVerif[v.estado].texto"></span></span>
                    <span><span x-text="v.nombre"></span><span class="apoyo" x-show="v.motivo" x-text="' - ' + v.motivo"></span></span>
                  </li>
              </template>
            </ol>
          </div>
        </article>
      </template>
    </section>
  </main>
  <style>[x-cloak]{display:none !important}</style>
</body>
</html>
