<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decisiones</title>
  <link rel="stylesheet" href="app.css">
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="nav.js"></script>
  <script defer src="alpine.min.js"></script>
</head>
<body x-data="app()" x-init="init()" class="min-h-screen">
  <header class="px-6 pt-5">
    <h1 class="text-2xl font-semibold">Decisiones</h1>
    <p class="mt-1 max-w-3xl text-texto-2" data-testid="subtitulo">Cada factura que llegó y lo que decidió el motor de reglas, con su motivo.</p>
    <ul class="mt-3 flex flex-wrap gap-x-5 gap-y-1" x-show="vigentes.length" x-cloak aria-label="Cifras" data-testid="resumen">
      <template x-for="r in resumen" :key="r[0]">
        <li :data-testid="'resumen-' + r[0]"><span class="cifra text-xl font-semibold" x-text="r[2]"></span> <span class="text-texto-2" x-text="r[1]"></span></li>
      </template>
    </ul>
  </header>

  <p x-show="error" x-cloak class="mx-6 mt-4 panel panel-fuerte p-4 text-frenar" role="alert" data-testid="error" x-text="error"></p>

  <main class="grid grid-cols-1 gap-6 p-4 sm:p-6 min-[1280px]:grid-cols-[minmax(0,25rem)_minmax(0,1fr)]">
    <section aria-label="Lista de decisiones" class="min-w-0">
      <p x-show="cargando" class="text-texto-2">Cargando…</p>
      <div x-show="!cargando && vigentes.length === 0" x-cloak class="panel panel-fuerte p-6" data-testid="lista-vacia">
        <h2 class="text-lg font-semibold">Todavía no hay documentos</h2>
        <p class="mt-1 text-texto-2">El set de ejemplo trae facturas por correo, chat, PDF y foto, algunas con trampas. El motor decide cada una y verá aquí el motivo.</p>
        <button type="button" class="btn btn-primario mt-4" data-testid="cargar-set-ejemplo" :disabled="ocupado" @click="cargarSet()">Cargar el set de ejemplo</button>
        <p class="mt-3 text-texto-2" role="status" data-testid="progreso" x-text="progreso"></p>
      </div>
      <div x-show="vigentes.length" x-cloak>
        <div class="flex flex-wrap gap-2">
          <input type="search" class="input w-auto min-w-[10rem] flex-1" placeholder="Buscar proveedor o número" aria-label="Buscar por proveedor o número" x-model="busqueda" data-testid="busqueda">
          <select class="input w-auto" x-model="filtro" aria-label="Filtrar por estado" data-testid="filtro-estado">
            <template x-for="f in filtros" :key="f[0]"><option :value="f[0]" x-text="f[1]"></option></template>
          </select>
        </div>
        <button type="button" class="btn btn-fantasma" :aria-expanded="masFiltros" @click="masFiltros = !masFiltros" data-testid="mas-filtros" x-text="masFiltros ? 'Menos filtros' : 'Más filtros'"></button>
        <div class="mb-3 grid grid-cols-2 gap-2" x-show="masFiltros" x-cloak>
          <select class="input" x-model="formato" aria-label="Filtrar por formato" data-testid="filtro-formato"><option value="">Todos los formatos</option>
            <template x-for="v in valoresReales('formato')" :key="v"><option :value="v" x-text="formatos[v] || v"></option></template></select>
          <select class="input" x-model="canalFiltro" aria-label="Filtrar por canal" data-testid="filtro-canal"><option value="">Todos los canales</option>
            <template x-for="v in valoresReales('canal')" :key="v"><option :value="v" x-text="canales[v] || v"></option></template></select>
        </div>
        <p x-show="visibles.length === 0" x-cloak class="text-texto-2" data-testid="filtro-vacio">Ningún documento con este filtro.</p>
        <ul class="grid gap-2" data-testid="lista-decisiones">
          <template x-for="d in visibles" :key="d.id">
            <li>
              <button type="button" class="panel grid w-full grid-cols-[auto_minmax(0,1fr)_auto] items-baseline gap-x-3 gap-y-1 p-3 text-left hover:bg-elevado" :class="sel && sel.id === d.id ? 'bg-elevado border-acento' : ''" :aria-current="sel && sel.id === d.id ? 'true' : null" @click="abrir(d)" :data-testid="'decision-' + d.id">
                <span class="chip chip-sombra self-center" x-show="f(d)" x-text="f(d) && (formatos[f(d).documento.formato] || f(d).documento.formato)"></span>
                <span class="col-start-2 truncate font-semibold" x-text="proveedor(d)"></span>
                <span class="cifra text-right font-semibold" x-show="f(d)"><span x-text="importe(d)"></span><span class="cent" x-text="centimos(d)"></span></span>
                <span class="col-span-2 col-start-2 text-sm text-texto-2" x-text="[f(d) && f(d).referencias.numero, fecha(d), f(d) && (canales[canal(d)] || canal(d)), aprobo(d) && 'Aprobó: ' + aprobo(d)].filter(Boolean).join(' · ')"></span>
                <span class="col-span-3 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
                  <span class="chip" :class="estadoDe(d).clase"><span aria-hidden="true" x-text="estadoDe(d).icono"></span><span x-text="estadoDe(d).texto"></span></span>
                  <span x-text="d.motivo_corto"></span>
                </span>
              </button>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <section aria-label="Detalle" x-ref="detalle" x-show="sel" x-cloak class="grid min-w-0 grid-cols-1 content-start gap-6 scroll-mt-4">
      <template x-if="sel">
        <div class="panel p-5" data-testid="detalle">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 class="text-xl font-semibold" data-testid="detalle-proveedor" x-text="proveedor(sel)"></h2>
              <p class="break-all text-sm text-texto-2"><span data-testid="detalle-archivo" x-text="archivo"></span> · Factura <span x-text="factura && factura.referencias.numero"></span></p>
            </div>
            <span class="chip" :class="estadoDe(sel).clase" data-testid="estado-decision"><span aria-hidden="true" x-text="estadoDe(sel).icono"></span><span x-text="estadoDe(sel).texto"></span></span>
          </div>
          <p class="mt-2 text-lg" data-testid="motivo" x-text="sel.motivo_corto"></p>
          <p class="mt-2 font-semibold text-texto-2" x-show="aprobo(sel)" data-testid="aprobo-detalle" x-text="'Aprobó: ' + aprobo(sel) + ', que reevaluó la decisión ' + sel.reevaluacion_de"></p>

          <div x-show="resultado" x-cloak class="mt-3 flex items-center gap-4" data-testid="sello" role="status">
            <template x-if="resultado && resultado.autorizada">
              <span class="inline-block rotate-[-6deg] animate-sellar border-2 border-papel-sello px-4 py-1 text-xl font-bold uppercase text-papel-sello" data-testid="sello-ok">Autorizada</span>
            </template>
            <template x-if="resultado && !resultado.autorizada">
              <span class="sello-roto" data-testid="sello-roto" role="img" aria-label="Sello partido: orden rechazada">
                <span class="inline-block border-2 border-frenar px-4 py-1 text-xl font-bold uppercase text-frenar">Rechaza</span><span class="inline-block border-2 border-frenar px-4 py-1 text-xl font-bold uppercase text-frenar">da</span>
              </span>
            </template>
            <p x-text="resultado && resultado.motivo"></p>
          </div>

          <div role="tablist" aria-label="Secciones de la decisión" class="mt-4 flex flex-wrap gap-x-6 border-b border-linea" @keydown.right.prevent="moverPestana(1)" @keydown.left.prevent="moverPestana(-1)">
            <template x-for="p in pestanas" :key="p[0]">
              <button type="button" role="tab" :id="'tab-' + p[0]" :aria-selected="pestana === p[0]" :aria-controls="'panel-' + p[0]" :tabindex="pestana === p[0] ? 0 : -1" @click="pestana = p[0]" :data-testid="'pestana-' + p[0]" :class="pestana === p[0] ? 'border-acento text-texto font-semibold' : 'border-transparent text-texto-2 hover:text-texto'" class="-mb-px border-b-2 py-2.5" x-text="p[1]"></button>
            </template>
          </div>

          <div id="panel-resumen" role="tabpanel" aria-labelledby="tab-resumen" x-show="pestana === 'resumen'" class="mt-4" data-testid="panel-resumen">
            <p class="text-sm text-texto-2" data-testid="autonomia" x-text="'Decisión: ' + (sel.modo_autonomia === 'autonomo' ? veredictos[sel.veredicto].autonomia : 'Sombra')"></p>
            <p class="mt-2" data-testid="explicacion" x-show="sel.explicacion && sel.explicacion !== sel.motivo_corto" x-text="sel.explicacion"></p>
            <p class="mt-2 border-l-4 border-linea-fuerte pl-3 font-semibold" data-testid="que-hacer" x-show="sel.que_hacer"><span class="apoyo">Siguiente paso: </span><span x-text="sel.que_hacer"></span></p>
            <ol class="mt-4 grid gap-2 sm:grid-cols-3" data-testid="etapas" aria-label="Estado del trámite">
              <template x-for="e in etapas" :key="e[0]"><li class="panel p-3" :data-testid="'etapa-' + e[0]"><span class="block text-sm text-texto-2" x-text="e[1]"></span><span class="font-semibold" :class="e[3] ? 'text-pagar' : 'text-texto-2'" x-text="e[2]"></span></li></template>
            </ol>
            <p class="mt-2 text-sm text-texto-2" data-testid="sin-pago-confirmado">No hay "pago confirmado": este producto no mueve dinero. La orden emitida es una simulación.</p>

            <section class="panel panel-fuerte mt-4 p-4" x-show="esperaAprobacion" x-cloak data-testid="aprobacion" aria-label="Aprobación">
              <h3 class="text-lg font-semibold">Espera aprobación</h3>
              <p class="apoyo mt-2 text-sm" x-show="!puedeDecidir" data-testid="solo-cfo">Solo el CFO aprueba o rechaza. Cambie el rol simulado en el encabezado para decidir.</p>
              <template x-if="puedeDecidir && esperaAprobacion">
                <div class="mt-3 grid gap-3">
                  <p class="apoyo text-sm" x-show="!aprobable" data-testid="no-aprobable">Esta escalada no ofrece aprobar: se resuelve fuera de la aplicación. Puede rechazarla.</p>
                  <label for="nota" class="apoyo text-sm">Nota (obligatoria al rechazar)</label>
                  <input id="nota" type="text" class="input" x-model="nota" data-testid="nota">
                  <div class="flex flex-wrap gap-3">
                    <template x-if="aprobable"><button type="button" class="btn btn-primario" data-testid="aprobar" :disabled="ocupado" @click="decidir('aprobar')">Aprobar y reevaluar</button></template>
                    <button type="button" class="btn btn-peligro" data-testid="rechazar" :disabled="ocupado" @click="decidir('rechazar')">Rechazar</button>
                  </div>
                </div>
              </template>
            </section>

            <div class="mt-4 flex flex-wrap items-center gap-3" x-show="recibo" x-cloak>
              <button type="button" class="btn btn-primario" x-show="!estadoOrden" data-testid="pedir-autorizacion" :disabled="ocupado" @click="pedirAutorizacion()">Pedir autorización al guardián</button>
              <button type="button" class="btn btn-sec max-w-full flex-wrap text-center" :disabled="!puedeDescargarOrden" @click="descargarOrden()" data-testid="descargar-pain001">Descargar la orden de pago <span class="etiqueta-simulada">SIMULADA</span> (pain.001)</button>
              <span class="apoyo text-sm" x-show="!estadoOrden" data-testid="orden-bloqueada">La orden se habilita cuando el guardián autoriza.</span>
            </div>
          </div>

          <div id="panel-documento" role="tabpanel" aria-labelledby="tab-documento" x-show="pestana === 'documento'" x-cloak class="mt-4" data-testid="documento-leido">
            <ol class="grid gap-2 sm:grid-cols-2" data-testid="proceso" aria-label="Proceso de la decisión">
              <template x-for="(p, i) in proceso" :key="p.id">
                <li class="panel p-3" :data-testid="'proceso-' + p.id">
                  <span class="flex items-center gap-2 text-sm font-semibold" :class="p.ok ? 'text-pagar' : 'text-frenar'"><span aria-hidden="true" x-text="p.ok ? '✓' : '✕'"></span><span x-text="(i + 1) + '. ' + p.titulo"></span></span>
                  <span class="block text-sm" x-text="p.texto"></span>
                </li>
              </template>
            </ol>
            <p class="mt-3 text-sm text-texto-2" x-show="!original && !factura">No hay documento para esta decisión.</p>
            <div class="mt-4 grid gap-4 md:grid-cols-2" x-show="original || factura">
              <div x-show="original"><h3 class="apoyo text-sm">Documento original</h3>
                <img x-show="tipoOriginal === 'imagen' && !imagenFalla" :src="tipoOriginal === 'imagen' ? urlArchivo : null" @error="imagenFalla = true" :alt="'Foto original del documento ' + (factura ? factura.referencias.numero : '')" class="panel mt-1 w-full" style="max-height:20rem;object-fit:contain" data-testid="original-imagen">
                <p class="mt-1 text-sm text-texto-2" x-show="tipoOriginal === 'imagen' && imagenFalla" data-testid="original-imagen-error">No se pudo cargar la imagen del documento.</p>
                <a class="btn btn-sec mt-1" x-show="tipoOriginal === 'pdf'" :href="urlArchivo" target="_blank" rel="noopener" data-testid="abrir-documento">Abrir el documento</a>
                <p class="mt-2 text-sm" x-show="tipoOriginal !== 'texto' && citaActiva" data-testid="origen-cita"><span class="apoyo">Origen en el documento: </span><q x-text="citaActiva"></q></p>
                <pre class="panel mt-1 max-h-[24rem] overflow-auto whitespace-pre-wrap p-3 font-tec text-sm" x-show="tipoOriginal === 'texto'" data-testid="original" tabindex="0"><span x-text="partesOriginal[0]"></span><mark x-ref="marca" class="rounded bg-escalar/30 text-texto" x-show="partesOriginal[1]" data-testid="cita-resaltada" x-text="partesOriginal[1]"></mark><span x-text="partesOriginal[2]"></span></pre></div>
              <div><h3 class="apoyo text-sm">Campos leídos</h3>
                <ul class="mt-1 grid gap-1" data-testid="leido">
                  <template x-for="c in leido" :key="c.clave">
                    <li><button type="button" class="grid w-full grid-cols-[6rem_minmax(0,1fr)] gap-x-2 rounded-[10px] border border-linea px-3 py-1.5 text-left text-sm hover:bg-elevado" :class="campo === c.clave ? 'bg-elevado border-acento' : ''" :aria-pressed="campo === c.clave" @click="elegirCampo(c.clave)" :data-testid="'campo-' + c.clave"><span class="apoyo" x-text="c.etiqueta"></span><span x-text="c.valor"></span></button></li>
                  </template>
                </ul>
                <p class="mt-2 text-sm" x-show="campo" x-cloak data-testid="evidencia"><span class="apoyo">Evidencia: </span><q x-show="citaActiva" x-text="citaActiva"></q><span x-show="!citaActiva">este campo no trae cita.</span></p>
                <p class="mt-2 text-sm text-texto-2" x-show="!campo">Elija un campo para ver su evidencia.</p>
              </div>
            </div>
            <div class="mt-4" data-testid="diferencias">
              <h3 class="apoyo text-sm">Lo que difiere</h3>
              <p class="text-sm text-texto-2" x-show="!diferencias.length">Nada difiere del registro ni de las reglas.</p>
              <ul class="grid gap-1"><template x-for="r in diferencias" :key="r.id"><li class="text-frenar"><span class="font-semibold" x-text="(nombresRegla[r.id] || r.id) + ': '"></span><span x-text="r.evidencia"></span></li></template></ul>
            </div>
            <details class="mt-3 text-sm">
              <summary class="cursor-pointer text-texto-2">Todas las reglas evaluadas</summary>
              <ul class="mt-1 grid gap-1">
                <template x-for="r in sel.reglas" :key="r.id">
                  <li class="flex gap-3"><span class="w-48 font-semibold" x-text="nombresRegla[r.id] || r.id"></span><span class="w-20" :class="r.estado === 'falla' ? 'text-frenar' : 'text-texto-2'" x-text="r.estado"></span><span class="text-texto-2" x-text="r.evidencia"></span></li>
                </template>
              </ul>
            </details>
          </div>

          <div id="panel-recibo" role="tabpanel" aria-labelledby="tab-recibo" x-show="pestana === 'recibo'" x-cloak class="mt-4" data-testid="panel-recibo">
            <p class="panel p-4 text-texto-2" x-show="!recibo" data-testid="sin-recibo">Esta decisión no tiene recibo: no se emitió orden de pago.</p>
            <template x-if="recibo">
              <article class="recibo p-6" data-testid="recibo">
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <h2 class="text-xl font-semibold">Recibo de decisión</h2>
                  <span class="font-semibold" data-testid="recibo-mandato">Mandato <span x-text="recibo.mandato_version"></span></span>
                  <span class="etiqueta-simulada">firma de demo</span>
                </div>
                <div class="mt-3 flex flex-wrap items-center gap-3">
                  <button type="button" class="btn btn-recibo" data-testid="verificar-recibo" @click="verificar()">Verificar firma</button>
                  <span x-show="verifRecibo" x-cloak class="font-semibold" role="status" data-testid="resultado-firma" x-text="verifRecibo && verifRecibo.valida ? 'Firma válida (clave ' + verifRecibo.clave_version + ')' : 'Firma no válida'"></span>
                  <button type="button" class="btn btn-recibo-sec ml-auto" data-testid="alternar-tecnica" @click="tecnica = !tecnica" x-text="tecnica ? 'Ver documento' : 'Ver vista técnica'"></button>
                </div>

                <div x-show="!tecnica" class="mt-4 grid gap-3" data-testid="recibo-documento">
                  <dl class="grid grid-cols-[7rem_minmax(0,1fr)] gap-y-2 sm:grid-cols-[10rem_minmax(0,1fr)]">
                    <dt class="apoyo">Factura</dt><dd x-text="(factura?.emisor?.nombre || '') + ' - ' + (factura?.referencias?.numero || recibo.factura_id)"></dd>
                    <dt class="apoyo">Monto</dt>
                    <dd class="cifra"><span x-text="recibo.moneda"></span> <span x-text="entero(recibo.monto_menor, recibo.moneda)"></span><span class="cent" x-text="centavos(recibo.monto_menor, recibo.moneda)"></span></dd>
                    <dt class="apoyo">Decisión</dt><dd x-text="veredictos[recibo.veredicto].texto + ' (' + (recibo.modo_autonomia === 'autonomo' ? 'autónomo' : recibo.modo_autonomia) + ')'"></dd>
                    <dt class="apoyo">Mandato</dt><dd x-text="recibo.mandato_version"></dd>
                    <dt class="apoyo">Emitido</dt><dd x-text="recibo.emitido_en"></dd>
                    <dt class="apoyo">Vence</dt><dd x-text="recibo.vence_en"></dd>
                    <dt class="apoyo">Firma</dt><dd class="font-tec break-all text-sm" x-text="recibo.firma + ' (clave ' + recibo.clave_version + ')'"></dd>
                  </dl>
                  <ul class="linea border-t pt-3 text-sm">
                    <template x-for="r in recibo.reglas" :key="r.id">
                      <li class="flex gap-3"><span class="w-10 font-semibold" x-text="r.id"></span><span x-text="r.estado"></span></li>
                    </template>
                  </ul>
                </div>

                <div x-show="tecnica" x-cloak class="mt-4 grid gap-3" data-testid="recibo-tecnica">
                  <label for="copia" class="apoyo text-sm">Alterar para la demo: se modifica una copia, nunca el recibo firmado.</label>
                  <textarea id="copia" rows="14" class="input font-tec text-sm" x-model="copia" data-testid="copia-recibo"></textarea>
                  <p x-show="copiaError" x-cloak class="text-frenar" role="alert" x-text="copiaError"></p>
                  <div class="flex flex-wrap gap-3">
                    <button type="button" class="btn btn-recibo" data-testid="verificar-copia" @click="verificarCopia()">Verificar con el guardián</button>
                    <button type="button" class="btn btn-recibo-sec" data-testid="restaurar-copia" @click="restaurar()">Restaurar</button>
                  </div>
                </div>

                <div class="linea mt-4 border-t pt-4" data-testid="verificar-externo">
                  <h3 class="font-semibold">Verificar sin esta aplicación</h3>
                  <ol class="mt-1 grid gap-1 text-sm">
                    <li>Descargue el <a class="underline" href="/api/auditoria/paquete" download="paquete-auditoria.json" @click.prevent="descargar('/api/auditoria/paquete', 'paquete-auditoria.json')" data-testid="enlace-paquete">paquete de auditoría</a> (paquete-auditoria.json).</li>
                    <li>Ejecute: <code class="font-tec" data-testid="comando-verificar">python3 nucleo/auditoria/verificar_paquete.py paquete-auditoria.json</code></li>
                    <li>Resultado esperado: <span class="font-semibold" data-testid="resultado-esperado">PAQUETE VALIDO</span>. Si alguien altera un recibo, el script imprime PAQUETE INVALIDO.</li>
                  </ol>
                </div>

                <div x-show="resultado" x-cloak class="linea mt-4 border-t pt-4" data-testid="guardian">
                  <h3 class="font-semibold">Verificaciones del guardián</h3>
                  <ol class="mt-2 grid gap-1 text-sm">
                    <template x-for="v in (resultado ? resultado.verificaciones : [])" :key="v.n">
                      <li class="flex gap-3" :data-testid="'verificacion-' + v.n">
                        <span class="w-28 font-semibold" :class="estadoVerif[v.estado].clase"><span aria-hidden="true" x-text="estadoVerif[v.estado].icono"></span> <span x-text="estadoVerif[v.estado].texto"></span></span>
                        <span><span x-text="v.nombre"></span><span class="apoyo" x-show="v.motivo" x-text="' - ' + v.motivo"></span></span>
                      </li>
                    </template>
                  </ol>
                </div>
              </article>
            </template>
          </div>

          <div id="panel-historial" role="tabpanel" aria-labelledby="tab-historial" x-show="pestana === 'historial'" x-cloak class="mt-4" data-testid="historial">
            <p class="text-sm text-texto-2" x-show="historial.length === 0">Sin eventos registrados.</p>
            <ol class="grid gap-2 text-sm">
              <template x-for="(h, i) in historial" :key="i"><li class="grid gap-x-3 sm:grid-cols-[11rem_minmax(0,1fr)]"><span class="cifra text-texto-2" x-text="hora(h.hora)"></span><span><span class="font-semibold" x-text="evento(h)"></span><span class="block" x-show="h.nota" x-text="h.nota"></span></span></li></template>
            </ol>
          </div>
        </div>
      </template>
